<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Recovered exploratory macro-F1 on inspected test sets</title>
  <desc id="desc">OSHA injury nature: baseline 64.0 percent and v2 constrained 80.1 percent, 333 cases. ConstructCIE accident type: baseline 82.1 percent and v2 constrained 93.1 percent, 80 cases. Results were recovered from saved reports and are exploratory.</desc>
  <rect width="900" height="350" rx="16" fill="#101827"/>
  <text x="38" y="42" fill="#f8fafc" font-family="Arial,sans-serif" font-size="23" font-weight="700">Reported exploratory macro-F1</text>
  <text x="38" y="68" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13">Saved v2.1 report values · evaluation not rerun here</text>
  <g font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">
    <text x="230" y="100">0%</text><text x="365" y="100">25%</text><text x="505" y="100">50%</text><text x="645" y="100">75%</text><text x="785" y="100">100%</text>
  </g>
  <g stroke="#334155" stroke-width="1">
    <line x1="250" y1="106" x2="250" y2="286"/><line x1="390" y1="106" x2="390" y2="286"/><line x1="530" y1="106" x2="530" y2="286"/><line x1="670" y1="106" x2="670" y2="286"/><line x1="810" y1="106" x2="810" y2="286"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#f8fafc">
    <text x="38" y="134" font-size="17" font-weight="700">OSHA injury nature</text><text x="38" y="154" fill="#94a3b8" font-size="12">n = 333 · Δ +16.0 pp [9.2, 22.1]</text>
    <text x="38" y="220" font-size="17" font-weight="700">ConstructCIE accident type</text><text x="38" y="240" fill="#94a3b8" font-size="12">n = 80 · Δ +11.0 pp [1.7, 21.1]</text>
  </g>
  <g>
    <rect x="250" y="118" width="358.4" height="25" rx="5" fill="#64748b"/><rect x="250" y="150" width="448.6" height="25" rx="5" fill="#38bdf8"/>
    <rect x="250" y="204" width="459.0" height="25" rx="5" fill="#64748b"/><rect x="250" y="236" width="521.4" height="25" rx="5" fill="#38bdf8"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
    <text x="615" y="136">64.0% baseline</text><text x="705" y="168">80.1% v2</text>
    <text x="716" y="222">82.1% baseline</text><text x="779" y="254">93.1% v2</text>
  </g>
  <text x="38" y="318" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="12">Descriptive comparison only; ConstructCIE's lower CI bound is +1.7 pp. OSHA is the stronger interview headline, not a clean-holdout claim.</text>
</svg>
